body{background:linear-gradient(160deg,#1c2549 0%,#131a3a 55%,#1c2549 100%);background-attachment:fixed;color:var(--text);font-family:"JetBrains Mono","Cairo",monospace;line-height:1.7}
html[lang="ar"] body, html[lang="ar"] .form-control, html[lang="ar"] .form-select, html[lang="ar"] .btn{font-family:"Cairo","JetBrains Mono",sans-serif}
h1,h2,h3,h4{font-weight:800}
a{color:var(--blue-d)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.muted{color:var(--muted)}

/* Nav */
.navbar{background:rgba(2,3,20,.94);backdrop-filter:blur(8px);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--blue) 33%,var(--gold) 33% 66%,var(--red) 66%) 1}
.navbar-brand{display:flex;align-items:center;gap:.6rem;font-weight:800;color:#fff}
.navbar-brand:hover{color:#fff}
.navbar-brand small{font-weight:700;color:#aab2cc}
.navbar-brand img{height:54px}
.navbar-brand{font-size:1.15rem;line-height:1.15}
.navbar-brand small{display:block;font-size:.8rem;color:var(--gold)!important}
.navbar{padding-block:.75rem}
.navbar .nav-link{white-space:nowrap;padding:.55rem 1.2rem;color:#f2f4fa;font-size:.95rem}
.navbar .nav-link:hover{color:var(--gold)}
.navbar-toggler{border-color:rgba(255,255,255,.35)}
.navbar-toggler-icon{filter:invert(1)}
.navbar .btn-lang{margin-inline-start:1.5rem}
@media (min-width:1400px){.navbar .nav-link{padding:.55rem 1.6rem}.navbar .nav-wide{gap:1.25rem}.navbar .btn-lang{margin-inline-start:2.5rem}}
@media (max-width:1199px){.navbar .btn-lang{margin:.5rem 0 .75rem}.navbar .nav-link{padding:.6rem .25rem}}
.btn-lang{border:1px solid var(--blue);color:#fff;background:transparent;border-radius:999px;padding:.25rem 1rem}
.btn-lang:hover{background:var(--blue);color:#fff}
.btn-gold{background:var(--gold);color:var(--navy);font-weight:700;border:0;border-radius:.5rem;padding:.7rem 1.6rem}
.btn-gold:hover{background:#ffcb3d;color:var(--navy)}
.btn-line{border:2px solid var(--blue);color:var(--text);border-radius:.5rem;padding:.65rem 1.6rem;font-weight:700}
.btn-line:hover{background:var(--blue);color:#fff}

    linear-gradient(90deg,rgba(2,3,20,.82) 0%,rgba(2,3,20,.68) 55%,rgba(2,3,20,.55) 100%),
    var(--hero-img) center bottom/cover no-repeat,
    radial-gradient(circle at 82% 18%,rgba(74,127,193,.4),transparent 45%),
    radial-gradient(circle at 12% 92%,rgba(245,183,24,.22),transparent 40%),
    #020314;color:#fff}

    linear-gradient(270deg,rgba(2,3,20,.82) 0%,rgba(2,3,20,.68) 55%,rgba(2,3,20,.55) 100%),

    radial-gradient(circle at 18% 18%,rgba(74,127,193,.4),transparent 45%),

.hero h1,.hero p{text-shadow:0 2px 14px rgba(2,3,20,.6)}
.hero h1,.hero .motto,.hero p{text-shadow:0 2px 14px rgba(2,3,20,.7)}
.hero h1 .blue{color:#8db3e6}
.hero .muted{color:#d3d9ec}
.hero .btn-line{color:#fff;border-color:#fff}
.hero .btn-line:hover{background:#fff;color:#14182e}
.hero-slides{position:absolute;inset:0;z-index:0}
.hero-slides .slide{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity 1.6s ease}
.hero-slides .slide.on{opacity:1}
.hero-slides::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.93) 0%,rgba(255,255,255,.8) 50%,rgba(255,255,255,.5) 100%)}
html[dir="rtl"] .hero-slides::after{background:linear-gradient(270deg,rgba(255,255,255,.93) 0%,rgba(255,255,255,.8) 50%,rgba(255,255,255,.5) 100%)}
.hero-slides:empty::after{display:none}
.hero{overflow:hidden}
.hero>.container{position:relative;z-index:1;width:100%}
.hero h1{font-size:clamp(2.2rem,5.5vw,4rem);line-height:1.15}
.motto{display:flex;flex-wrap:wrap;gap:.5rem 1.1rem;font-weight:700;margin:1.2rem 0 2rem}
.motto span+span{padding-inline-start:1.1rem;border-inline-start:2px solid}
.motto span:nth-child(1)+span{border-color:var(--blue)}
.motto span:nth-child(2)+span{border-color:var(--gold)}
.motto span:nth-child(3)+span{border-color:var(--red)}
.hero-logo{max-width:420px;width:100%;filter:drop-shadow(0 12px 30px rgba(20,24,46,.12))}
.hero-logo{animation:rise 1s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* Sections */
section{padding:.9rem 0;margin-top:1rem}
section>.container{position:relative;overflow:hidden;border-radius:1.6rem;padding:2.8rem;box-shadow:0 14px 36px rgba(20,24,46,.16);border-top:4px solid var(--acc,var(--blue));background:var(--card-bg,#eff2f7)}
section>.container>*{position:relative;z-index:1}
@media (max-width:575px){section>.container{width:calc(100% - 1.5rem);padding:1.5rem}}
#about>.container{--acc:var(--blue);}
#offer>.container{--acc:var(--gold);}
#leaders>.container{--acc:var(--red);}
#contact>.container{--acc:var(--red);}
.sec-title{font-size:clamp(1.3rem,3vw,2rem);margin:0 0 1.8rem;background:#020314;color:#fff;padding:.7rem 1.4rem;width:fit-content;max-width:100%;border-bottom:5px solid;border-image:linear-gradient(90deg,var(--blue) 33%,var(--gold) 33% 66%,var(--red) 66%) 1}
html[lang="ar"] .sec-title{line-height:1.6}
#events .sec-title{background:#12183a}
.bar{display:none;height:4px;width:120px;margin-bottom:2rem;border-radius:4px;overflow:hidden}
.bar i{flex:1}.bar i:nth-child(1){background:var(--blue)}.bar i:nth-child(2){background:var(--gold)}.bar i:nth-child(3){background:var(--red)}

/* Feature items: left rule like the banner */
.feature{background:#fff;border-radius:1.2rem;padding:1.3rem;box-shadow:0 6px 18px rgba(20,24,46,.1);display:flex;gap:1.1rem;align-items:flex-start;height:100%}
.feature .ico{flex:none;width:64px;height:64px;border:3px solid var(--blue);border-radius:50%;display:grid;place-items:center;font-size:1.7rem}
.feature .txt{border-inline-start:2px solid var(--navy);padding-inline-start:1rem}
.feature h3{color:var(--gold-d);font-size:1.15rem}
.feature p{margin:0;color:var(--muted);font-size:.92rem}

/* Events */
#events>.container{--acc:var(--gold);--card-bg:linear-gradient(135deg,#0a0d24,#020314);color:#f2f4fa}
#events .muted,#events .event p{color:#aab2cc}
#events .event{background:#0a0d24;border-color:rgba(255,255,255,.1);box-shadow:none}
#events .event h3{color:#fff}
.event{display:flex;gap:1.2rem;align-items:center;padding:1.1rem 1.3rem;border-radius:.75rem;background:var(--ink);border:1px solid rgba(20,24,46,.1);box-shadow:0 2px 10px rgba(20,24,46,.05);margin-bottom:1rem}
.event .date{flex:none;width:76px;text-align:center;border-radius:.6rem;padding:.45rem 0;font-weight:800;line-height:1.1}
.event .date b{display:block;font-size:1.7rem}
.event .date small{font-weight:700}
.event h3{font-size:1.1rem;margin:0}
.event p{margin:0;color:var(--muted);font-size:.88rem}
.tag{display:inline-block;font-size:.75rem;border:1px solid currentColor;border-radius:999px;padding:0 .6rem;margin-inline-end:.4rem}

/* Join section with image overlay */
#join>.container{--acc:var(--blue);--card-bg:linear-gradient(180deg,rgba(239,242,247,.95),rgba(239,242,247,.92)),var(--join-img) center/cover no-repeat,#eff2f7}
.gform{padding:1rem}
.gform iframe{display:block;width:100%;height:1400px;border:0;border-radius:.8rem;background:#fff;transition:height .5s ease}
@media (max-width:575px){.gform iframe{height:1700px}}
.gform iframe.done{height:340px!important}
.form-card{background:rgba(255,255,255,.97);box-shadow:0 10px 40px rgba(20,24,46,.12);border:1px solid rgba(20,24,46,.1);border-top:4px solid var(--gold);border-radius:1rem;padding:2rem}
.form-label{font-weight:700;font-size:.9rem}
.form-control,.form-select{background:#fff;border:1px solid rgba(20,24,46,.25);color:var(--text);padding:.65rem .9rem}
.form-control:focus,.form-select:focus{background:#fff;color:var(--text);border-color:var(--blue);box-shadow:0 0 0 .2rem rgba(74,127,193,.25)}
.form-control::placeholder{color:#9aa1b8}
.form-select option{background:#fff}


.sup{display:flex;gap:1.5rem;align-items:center;background:#fff;border:1px solid rgba(20,24,46,.1);border-inline-start:6px solid var(--gold);border-radius:1rem;padding:1.5rem;box-shadow:0 2px 12px rgba(20,24,46,.06)}
.sup .avatar{flex:none;width:120px;height:120px;border-radius:50%;border:4px solid var(--gold);display:grid;place-items:center;font-size:2.6rem;overflow:hidden;background:#fff}
.sup .avatar img{width:100%;height:100%;object-fit:cover}
.sup h3{font-size:1.3rem;margin:0}
.sup .role{font-weight:700;color:var(--gold-d)}
.sup p{margin:.3rem 0 0;color:var(--muted)}
@media (max-width:575px){.sup{flex-direction:column;text-align:center}}
.leader{text-align:center;height:100%;background:#fff;border-radius:1.2rem;padding:1.5rem 1rem;box-shadow:0 6px 18px rgba(20,24,46,.1)}
.leader .avatar{width:132px;height:132px;border-radius:50%;margin:0 auto 1rem;border:4px solid var(--c);display:grid;place-items:center;font-size:2.6rem;background:#fff;overflow:hidden}
.leader .avatar img{width:100%;height:100%;object-fit:cover}
.leader h3{font-size:1.1rem;margin:0}
.leader .role{font-weight:700;font-size:.88rem;color:var(--c-text);margin:.1rem 0 .4rem}
.leader p{color:var(--muted);font-size:.88rem;margin:0}

.c-item{display:flex;align-items:center;gap:1rem;padding:1rem 1.3rem;background:#fff;border-radius:1.2rem;box-shadow:0 6px 18px rgba(20,24,46,.1);color:var(--text);text-decoration:none}
a.c-item:hover .c-val{color:var(--blue-d);text-decoration:underline}
.c-ico{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;font-size:1.2rem}
.c-lbl{display:block;font-size:.8rem;color:var(--muted)}
.c-val{font-weight:700;word-break:break-word}
.c-form{background:var(--ink-2);border-radius:1rem;padding:2rem;border-top:4px solid var(--blue)}
footer{margin-top:2rem;padding:2rem 0;border-radius:2rem 2rem 0 0;background:#020314;color:#aab2cc;font-size:.85rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero-logo{animation:none}}
</style>
</head>

const COLORS={blue:"var(--blue)",gold:"var(--gold)",red:"#c0392b"};
const TAG={blue:"#8db3e6",gold:"#f5b718",red:"#f07a6c"};
const DATE_TXT={blue:"#fff",gold:"#14182e",red:"#fff"};
const BS_LTR="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";
const BS_RTL="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
let lang = "en";
try{ const s=localStorage.getItem("psc-lang"); if(s) lang=s; }catch(e){}

function renderEvents(){
  const box=document.getElementById("eventList");
  const upcoming=EVENTS.filter(e=>new Date(e.date)>=new Date(new Date().toDateString())).sort((a,b)=>a.date.localeCompare(b.date));
  if(!upcoming.length){box.innerHTML='<p class="muted">'+(lang==="ar"?"لا توجد فعاليات قادمة حاليًا، تابعنا قريبًا.":"No upcoming events right now. Check back soon.")+'</p>';return;}
  box.innerHTML=upcoming.map(e=>{
    const d=new Date(e.date), c=COLORS[e.color]||COLORS.gold, x=e[lang];
    return `<article class="event"><div class="date" style="background:${c};color:${DATE_TXT[e.color]||"#14182e"}"><b>${d.getDate()}</b><small>${d.toLocaleDateString(T[lang].dateLocale,{month:"short"})}</small></div>
      <div><span class="tag" style="color:${TAG[e.color]||TAG.gold}">${x.tag}</span><h3>${x.t}</h3><p>${x.d}</p></div></article>`;
  }).join("");
}

const CC={blue:["var(--blue)","var(--blue-d)"],gold:["var(--gold)","var(--gold-d)"],red:["#c0392b","#a62a1e"]};
function renderLeaders(){
  const sp=SUPERVISOR, st=sp[lang];
  const sav=sp.photo?`<img src="images/${sp.photo}" alt="${st.n}" onerror="this.parentNode.textContent='👩‍🏫'">`:"👩‍🏫";
  document.getElementById("supervisor").innerHTML=`<div class="sup"><div class="avatar">${sav}</div><div><h3>${st.n}</h3><div class="role">${st.r}</div><p>${st.d}</p></div></div>`;
  document.getElementById("leaderList").innerHTML=LEADERS.map(x=>{
    const c=CC[x.color]||CC.gold, t=x[lang];
    const av=x.photo?`<img src="images/${x.photo}" alt="${t.n}" onerror="this.parentNode.textContent='👤'">`:"👤";
    return `<div class="col-6 col-lg-4"><div class="leader" style="--c:${c[0]};--c-text:${c[1]}"><div class="avatar">${av}</div><h3>${t.n}</h3><div class="role">${t.r}</div><p>${t.d}</p></div></div>`;
  }).join("");
}
function renderContact(){
  document.getElementById("phoneText").textContent=PHONE;
  document.getElementById("phoneLink").href="tel:"+PHONE.replace(/[^+\d]/g,"");
}
function setLang(l){
  lang=l; const t=T[l];
  document.documentElement.lang=l; document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.getElementById("bs").href = l==="ar"?BS_RTL:BS_LTR;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ if(t[el.dataset.i18n]!==undefined) el.textContent=t[el.dataset.i18n]; });
  document.getElementById("langBtn").textContent = l==="ar"?"English":"العربية";
  document.title = l==="ar"?"نادي حل المشكلات - جامعة البلقاء التطبيقية":"Problem Solving BAU Club";
  try{localStorage.setItem("psc-lang",l)}catch(e){}
  renderEvents(); renderLeaders(); renderContact();
}
document.getElementById("langBtn").addEventListener("click",()=>setLang(lang==="ar"?"en":"ar"));

// When the Google Form is submitted the iframe reloads once: shrink the box to fit the thank-you message
(function(){
  const fr=document.querySelector(".gform iframe"); if(!fr) return;
  let loads=0;
  fr.addEventListener("load",()=>{
    loads++;
    if(loads>1){ fr.classList.add("done"); fr.closest(".gform").scrollIntoView({behavior:"smooth",block:"center"}); }
  });
})();

setLang(lang);
